<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gerente - Calibración UX/UI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #eef2f5; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { background: #fff; width: 100%; max-width: 900px; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .pantalla { display: none; }
        .pantalla.activa { display: block; }
        h1, h2 { text-align: center; color: #111; margin-bottom: 5px; }
        p { text-align: center; color: #555; margin-bottom: 30px; }
        .selector-area { background: #e8f0fe; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 5px solid #1a73e8; }
        .selector-area label { font-weight: bold; color: #1a73e8; display: block; margin-bottom: 10px; }
        select { padding: 12px; border-radius: 5px; border: 1px solid #ccc; width: 100%; font-size: 16px; }
        .grid-captura { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; background: #f9f9f9; padding: 15px; border-radius: 8px; }
        .desc-concepto { font-size: 0.85rem; color: #666; display: block; grid-column: 1 / -1; font-weight: bold; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 5px;}
        .col-input { display: flex; flex-direction: column; }
        .col-input label { font-size: 0.85rem; margin-bottom: 5px; color: #444; }
        button { width: 100%; padding: 15px; background: #000; color: #fff; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:hover { background: #333; }
        .btn-descarga { background: #28a745; }
        .chart-container { position: relative; height: 500px; width: 100%; margin-top: 20px; }
        .loader { display: none; text-align: center; color: #1a73e8; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="pantalla1" class="pantalla activa">
        <h1>Panel de Calibración 1:1</h1>
        
        <div class="selector-area">
            <label>Evaluaciones Pendientes (Desde tu Excel):</label>
            <select id="selectorColaborador" onchange="cargarDatosColaborador()">
                <option value="">Cargando equipo...</option>
            </select>
        </div>
        
        <div id="formGerente">
            <div class="grid-captura">
                <span class="desc-concepto">1. Estrategia de Producto y Negocio</span>
                <div class="col-input"><label>Colaborador</label><select id="user_0" disabled><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
                <div class="col-input"><label>Tú (Líder)</label><select id="mgr_0"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
            </div>
            <div class="grid-captura">
                <span class="desc-concepto">2. Problem Framing y Pensamiento Crítico</span>
                <div class="col-input"><label>Colaborador</label><select id="user_1" disabled><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
                <div class="col-input"><label>Tú (Líder)</label><select id="mgr_1"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
            </div>
            <div class="grid-captura">
                <span class="desc-concepto">3. Adaptabilidad y Orquestación con IA</span>
                <div class="col-input"><label>Colaborador</label><select id="user_2" disabled><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
                <div class="col-input"><label>Tú (Líder)</label><select id="mgr_2"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
            </div>
            <div class="grid-captura">
                <span class="desc-concepto">4. Gestión de Stakeholders</span>
                <div class="col-input"><label>Colaborador</label><select id="user_3" disabled><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
                <div class="col-input"><label>Tú (Líder)</label><select id="mgr_3"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
            </div>
            <div class="grid-captura">
                <span class="desc-concepto">5. Mentoría y Talento</span>
                <div class="col-input"><label>Colaborador</label><select id="user_4" disabled><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
                <div class="col-input"><label>Tú (Líder)</label><select id="mgr_4"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div>
            </div>

            <button id="btnGenerar" onclick="guardarYGenerarGrafica()">Guardar Calificación en Sheet y Ver Gráfica</button>
            <div id="loader" class="loader">Guardando datos en Google Sheets...</div>
        </div>
    </div>

    <div id="pantalla2" class="pantalla">
        <h2>Matriz Final de Calibración</h2>
        <div class="chart-container"><canvas id="chartFinal"></canvas></div>
        <button class="btn-descarga" onclick="descargarGrafica()">Descargar Gráfica para Expediente</button>
        <button onclick="location.reload()" style="background: #666;">Evaluar a alguien más</button>
    </div>
</div>

<script>
    const conceptos = ["Estrategia", "Problem Framing", "Uso de IA", "Stakeholders", "Mentoría"];
    const lineaBase = [4, 4, 3, 4, 3]; 
    let chartRef;
    let baseDatos = [];

    // --- REEMPLAZA LA URL AQUÍ ---
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbwUNuYeZEb3ZwJB1WUuSBlJf2Nf124KH2EmTggnlpoZJ2KLswftVuF6HfXQrDBHSjhe/exec";

    document.addEventListener("DOMContentLoaded", () => {
        fetch(urlGoogleScript)
        .then(res => res.json())
        .then(datos => {
            baseDatos = datos;
            const selector = document.getElementById("selectorColaborador");
            selector.innerHTML = '<option value="">Selecciona un colaborador...</option>';
            datos.forEach((item, index) => {
                const fecha = new Date(item.fecha).toLocaleDateString();
                const estado = item.mgr_scores[0] !== "" ? "✅ (Ya calibrado)" : "⏳ (Pendiente)";
                selector.innerHTML += `<option value="${index}">${item.nombre} - ${fecha} ${estado}</option>`;
            });
        })
        .catch(err => document.getElementById("selectorColaborador").innerHTML = '<option value="">Error al cargar datos. Revisa la URL.</option>');
    });

    function cargarDatosColaborador() {
        const index = document.getElementById("selectorColaborador").value;
        if (index === "") return;
        
        // Llena los datos del usuario (bloqueados)
        const scores = baseDatos[index].scores;
        for(let i=0; i<5; i++) document.getElementById("user_"+i).value = scores[i];
        
        // Llena tus datos si ya lo habías evaluado antes
        const mgr_scores = baseDatos[index].mgr_scores;
        if(mgr_scores[0] !== "") {
            for(let i=0; i<5; i++) document.getElementById("mgr_"+i).value = mgr_scores[i];
        } else {
            for(let i=0; i<5; i++) document.getElementById("mgr_"+i).value = 3; // default
        }
    }

    function guardarYGenerarGrafica() {
        const index = document.getElementById("selectorColaborador").value;
        if (index === "") return alert("Selecciona un colaborador primero.");

        const btn = document.getElementById("btnGenerar");
        const loader = document.getElementById("loader");
        btn.style.display = "none";
        loader.style.display = "block";

        const datosGerente = [0,1,2,3,4].map(i => Number(document.getElementById('mgr_'+i).value));
        const nombreEmpleado = baseDatos[index].nombre;
        const filaExcel = baseDatos[index].fila;

        // Construir datos para enviar a Google Script
        const formData = new FormData();
        formData.append("action", "save_manager");
        formData.append("fila", filaExcel);
        datosGerente.forEach((val, i) => formData.append("mgr_" + i, val));

        fetch(urlGoogleScript, { method: 'POST', body: formData })
        .then(() => {
            mostrarGraficaFinal(index, nombreEmpleado, datosGerente);
        })
        .catch(() => alert("Error al guardar en Sheet, pero mostraremos la gráfica de todas formas."))
        .finally(() => {
            mostrarGraficaFinal(index, nombreEmpleado, datosGerente);
        });
    }

    function mostrarGraficaFinal(index, nombre, datosGerente) {
        const datosUsuario = [0,1,2,3,4].map(i => Number(document.getElementById('user_'+i).value));
        document.getElementById('pantalla1').classList.remove('activa');
        document.getElementById('pantalla2').classList.add('activa');

        const ctx = document.getElementById('chartFinal').getContext('2d');
        if (chartRef) chartRef.destroy();
        
        chartRef = new Chart(ctx, {
            type: 'radar',
            data: { 
                labels: conceptos, 
                datasets: [
                    { label: "Expectativa", data: lineaBase, borderColor: "gray", borderDash: [5,5], backgroundColor: "rgba(0,0,0,0)" },
                    { label: "Autoevaluación", data: datosUsuario, borderColor: "blue", backgroundColor: "rgba(54, 162, 235, 0.1)" },
                    { label: "Evaluación Líder", data: datosGerente, borderColor: "red", backgroundColor: "rgba(255, 99, 132, 0.4)" }
                ] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 5, ticks: { stepSize: 1 } } },
                plugins: {
                    title: { display: true, text: 'Calibración UX/UI: ' + nombre, font: { size: 18 } }
                }
            },
            plugins: [{ id: 'fondoBlanco', beforeDraw: (c) => {
                const ctx = c.canvas.getContext('2d');
                ctx.save(); ctx.fillStyle = 'white'; ctx.fillRect(0, 0, c.width, c.height); ctx.restore();
            }}]
        });
    }

    function descargarGrafica() {
        const selector = document.getElementById("selectorColaborador");
        const nombre = baseDatos[selector.value].nombre.replace(/\s+/g, '_');
        const enlace = document.createElement('a');
        enlace.href = document.getElementById('chartFinal').toDataURL('image/png');
        enlace.download = `Calibracion_${nombre}_UX.png`;
        enlace.click();
    }
</script>
</body>
</html>
